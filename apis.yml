name: Looly's
description: >-
  Looly's PBC (doing business as WeTheTrillions) was a San Francisco public
  benefit corporation founded in 2013 by Lamiaa Bounahmidi that reengineered
  preventative healthcare through microbiome science, evidence-based clinical
  research, telemedicine, and plant-based food. It delivered fresh,
  ready-to-eat plant-based meal and snack bundles targeted at chronic
  conditions such as IBS/SIBO, diabetes and PCOS, plus a fertility program.
  Backed by 500 Global and part of the API Evangelist network as a
  VC-portfolio lead, the company is a consumer food and health business with
  no public API surface. Its primary domain (wethetrillions.com) no longer
  resolves and the venture appears to be defunct/deadpooled.
